# The getyourkite conda environment: KITE, the LEAP dataset (get-ur-kite-dataset) and getkite.
# Conda only provides Python; every Python package is pinned in requirements.txt and installed
# by scripts/setup_env.sh (with --no-deps, as KITE does). Linux, NVIDIA GPU, CUDA Toolkit 12.8.
#
#   bash scripts/setup_env.sh          # creates and fills it
name: getyourkite
channels:
  - defaults
dependencies:
  - python=3.10.19
  - pip=25.3
  - setuptools=80.9.0
  - wheel=0.45.1
